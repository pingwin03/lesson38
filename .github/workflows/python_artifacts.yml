name: Python Artifacts Workflow

on:
  push:

jobs:
  test_and_artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Uruchomienie testów z raportem JUnit
        run: |
          mkdir -p reports
          pytest tests/ --junitxml=reports/test-results.xml

      - name: Zapisanie wyników testów jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-artifact
          path: reports/