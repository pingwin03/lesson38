name: Daily Security Scan

on:
  schedule:
    # Format cron: Minuta (0) Godzina (3) Dzień Miesiąc Dzień_tygodnia
    - cron: '0 3 * * *'
  # Pozwala na ręczne uruchomienie workflow do testów
  workflow_dispatch:

jobs:
  security_scan:
    runs-on: ubuntu-latest
    
    # Nadajemy uprawnienia do tworzenia Issue w repozytorium
    permissions:
      contents: read
      issues: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Uruchomienie skanowania bezpieczeństwa (pip-audit)
        run: |
          # Skanuje plik requirements.txt (jeśli istnieje) i zapisuje wynik do pliku txt
          # Jeśli pip-audit znajdzie luki, zakończy się błędem (exit code 1)
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt > audit-report.txt
          else
            echo "Brak pliku requirements.txt do przeskanowania." > audit-report.txt
          fi

      - name: Utworzenie GitHub Issue w przypadku wykrycia luk
        # Ten krok wykona się TYLKO wtedy, gdy poprzedni krok zgłosi błąd (znajdzie lukę)
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "🚨 Wykryto luki w bezpieczeństwie (pip-audit)"
          content-filepath: ./audit-report.txt
          labels: security, automated-issue