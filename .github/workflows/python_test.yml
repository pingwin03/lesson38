name: Python Test

on:
  push:

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      # Krok 1: Pobieram kod z repozytorium
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      # Krok 2: Konfiguruję Pythona
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Krok 3: Instaluję zależności z requirements.txt (w tym nasz pytest)
      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Krok 4: Wykonuję polecenie zadania - uruchamiam pytest
      - name: Uruchomienie testów z pytest
        run: pytest