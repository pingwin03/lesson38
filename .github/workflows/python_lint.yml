name: Python Linting with Flake8

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja zależności oraz flake8
        run: |
          python -m pip install --upgrade pip
          # Instaluję pakiety z requirements.txt oraz flake8 zgodnie z poleceniem
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Uruchomienie linting z flake8 dla folderu src
        run: |
          # Sprawdzam kod w folderze src/ za pomocą flake8
          flake8 src/