name: Python Multi-Job Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Zadanie 1: Linting kodu
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja zależności i flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Uruchomienie flake8 dla folderu src
        run: flake8 src/

  # Zadanie 2: Uruchomienie testów
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Uruchomienie pytest
        run: pytest

  # Zadanie 3: Budowanie aplikacji (wykonuje się tylko po sukcesie lint i test)
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Symulacja budowania aplikacji
        run: |
          echo "Testy oraz linting przeszły pomyślnie!"
          echo "Rozpoczynam proces budowania aplikacji..."
          python -m pip install --upgrade pip
          pip install build
          python -m build
          echo "Aplikacja została pomyślnie zbudowana!"